name: Care Team catch-up

# Runs only when you start it (no schedule, so no background GitHub minutes).
# Adds Care team rows to Practice-Impacting cards that are awaiting review or
# approved but not yet sent and don't have rows yet — mainly FDA approvals added
# by hand in the admin portal after the weekly pipeline has run. Cards that
# already have rows are skipped. Never touches published cards. Readers see
# nothing until CARE_TEAM_PUBLIC is switched on.
#
# Start it: admin portal "Generate now" link, or Actions → "Care Team catch-up" → Run workflow.
# Redo: set "Redo cards..." to true to refresh rows on cards you haven't edited or approved.

on:
  workflow_dispatch:
    inputs:
      redo:
        description: 'Redo cards that already have Care team rows (never ones you edited or approved)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  care-team:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/carcinos_ingestion/requirements.txt

      - name: Install dependencies
        run: |
          cd pipeline
          pip install -r carcinos_ingestion/requirements.txt

      - name: Add Care team rows to new cards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd pipeline
          REDO_FLAG=""
          if [ "${{ github.event.inputs.redo }}" = "true" ]; then REDO_FLAG="--force"; fi
          python -m carcinos_ingestion.care_team.run_care_team --write --since-days 10 $REDO_FLAG
