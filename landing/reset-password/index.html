<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<title>CarcinoS — Reset Password</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060609;
    --body: #b0b0bc;
    --white: #ffffff;
    --grey: rgba(255,255,255,0.55);
    --grey-dim: rgba(255,255,255,0.35);
    --border: rgba(255,255,255,0.10);
    --green: #72a37a;
    --green-dim: rgba(114,163,122,0.14);
    --green-border: rgba(114,163,122,0.35);
  }
  html, body {
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── nav ── */
  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(6,6,9,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo {
    width: 34px; height: 34px;
    border: 1.5px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif;
    font-size: 14px; font-weight: 800;
    color: #fff;
    letter-spacing: -0.4px;
  }
  .nav-name { font-size: 17px; font-weight: 700; color: var(--white); letter-spacing: -0.3px; }
  .nav-name .s { color: var(--green); }

  /* ── main ── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
  }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .card-sub {
    font-size: 13px;
    color: var(--grey-dim);
    margin-bottom: 24px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--grey-dim);
    margin-bottom: 6px;
  }
  .field-input {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--white);
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: rgba(114,163,122,0.5); }
  .field-input::placeholder { color: var(--grey-dim); }

  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--green);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  .btn-submit:hover { opacity: 0.88; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg-error {
    font-size: 13px;
    color: #e07070;
    background: rgba(220,80,80,0.1);
    border: 1px solid rgba(220,80,80,0.25);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    display: none;
  }
  .msg-success {
    font-size: 13px;
    color: var(--green);
    background: var(--green-dim);
    border: 1px solid var(--green-border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
  }

  .invalid-state {
    text-align: center;
    padding: 24px 0 8px;
    color: var(--grey-dim);
    font-size: 14px;
  }
  .invalid-state a {
    color: var(--green);
    text-decoration: none;
  }
  .invalid-state a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <div class="nav-logo">C<span style="color:var(--green)">S</span></div>
    <span class="nav-name">Carcino<span class="s">S</span></span>
  </a>
</nav>

<main>
  <div class="card">
    <div id="formView">
      <div class="card-title">Set new password</div>
      <div class="card-sub">Choose a strong password for your CarcinoS account.</div>

      <div id="msgError" class="msg-error"></div>
      <div id="msgSuccess" class="msg-success"></div>

      <div class="field-label">New password</div>
      <input class="field-input" type="password" id="pw1" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" />

      <div class="field-label">Confirm password</div>
      <input class="field-input" type="password" id="pw2" placeholder="Repeat your new password" autocomplete="new-password" minlength="6" />

      <button class="btn-submit" id="submitBtn" onclick="handleReset()">Update password</button>
    </div>

    <div id="invalidView" class="invalid-state" style="display:none;">
      This reset link is invalid or has expired.<br><br>
      <a href="/archive">Go to the portal</a> and use "Forgot password?" to request a new one.
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL     = 'https://kbsingwzbgbdkmhmdaep.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtic2luZ3d6YmdiZGttaG1kYWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzcyMTIsImV4cCI6MjA5NjE1MzIxMn0.NgC1xqY22-q4dLOhsuBb10uPHcnkEP8smSTtcwUqMpY';

  var sbClient = null;

  // Load Supabase and initialise session from URL hash (contains the reset token)
  (function loadSupabase() {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = function() {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, storageKey: 'carcinos-auth' }
      });

      // Check if the URL contains a valid recovery token
      sbClient.auth.onAuthStateChange(function(event, session) {
        if (event === 'PASSWORD_RECOVERY') {
          // Valid reset link — show the form (already visible by default)
        } else if (!session && !window.location.hash.includes('access_token')) {
          // No token at all — show invalid state
          document.getElementById('formView').style.display = 'none';
          document.getElementById('invalidView').style.display = 'block';
        }
      });
    };
    s.onerror = function() {
      showError('Failed to load authentication library. Please refresh and try again.');
    };
    document.head.appendChild(s);
  })();

  async function handleReset() {
    var pw1 = document.getElementById('pw1').value.trim();
    var pw2 = document.getElementById('pw2').value.trim();
    var btn = document.getElementById('submitBtn');

    hideMessages();

    if (!pw1 || pw1.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }
    if (pw1 !== pw2) {
      showError('Passwords do not match.');
      return;
    }
    if (!sbClient) {
      showError('Authentication not ready. Please refresh and try again.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    try {
      var result = await sbClient.auth.updateUser({ password: pw1 });
      if (result.error) throw result.error;

      showSuccess('Password updated. Taking you to the portal…');
      setTimeout(function() { window.location.href = '/archive'; }, 2000);
    } catch(e) {
      showError(e.message || 'Something went wrong. Please request a new reset link.');
      btn.disabled = false;
      btn.textContent = 'Update password';
    }
  }

  function showError(msg) {
    var el = document.getElementById('msgError');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function showSuccess(msg) {
    var el = document.getElementById('msgSuccess');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideMessages() {
    document.getElementById('msgError').style.display = 'none';
    document.getElementById('msgSuccess').style.display = 'none';
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleReset();
  });
</script>
</body>
</html>
