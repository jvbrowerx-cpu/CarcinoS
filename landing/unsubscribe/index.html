<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CarcinoS — Unsubscribe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #060609;
    color: #b0b0bc;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 480px;
    width: 100%;
    margin: 40px 24px;
    text-align: center;
  }
  .logo {
    width: 48px; height: 48px;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 11px;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif;
    font-size: 17px; font-weight: 800;
    color: #72a37a;
    margin: 0 auto 24px;
  }
  .brand {
    font-size: 20px; font-weight: 700;
    color: #fff; letter-spacing: -0.3px;
    margin-bottom: 32px;
  }
  .brand span { color: #72a37a; }

  .panel {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 36px 32px;
  }

  .icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 26px;
  }
  .icon.pending   { background: rgba(255,255,255,0.05); }
  .icon.success   { background: rgba(114,163,122,0.15); }
  .icon.error     { background: rgba(220,80,80,0.15); }

  h1 {
    font-size: 21px; font-weight: 700;
    color: #fff; letter-spacing: -0.3px;
    margin-bottom: 10px;
  }
  p {
    font-size: 14px; color: rgba(255,255,255,0.5);
    line-height: 1.6; margin-bottom: 0;
  }
  .sub { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.3); }

  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 11px 24px;
    border-radius: 8px;
    font-size: 14px; font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  .btn-confirm {
    background: rgba(220,80,80,0.15);
    color: #e88;
    border: 1px solid rgba(220,80,80,0.25);
  }
  .btn-confirm:hover { background: rgba(220,80,80,0.22); }
  .btn-cancel {
    background: transparent;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    margin-left: 10px;
  }
  .btn-cancel:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2); }
  .btn-home {
    background: rgba(114,163,122,0.12);
    color: #72a37a;
    border: 1px solid rgba(114,163,122,0.25);
  }
  .btn-home:hover { background: rgba(114,163,122,0.2); }

  .spinner {
    width: 24px; height: 24px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #72a37a;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo">CS</div>
  <div class="brand">Carcino<span>S</span></div>

  <div class="panel" id="panel">
    <!-- State rendered by JS -->
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kbsingwzbgbdkmhmdaep.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtic2luZ3d6YmdiZGttaG1kYWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzcyMTIsImV4cCI6MjA5NjE1MzIxMn0.NgC1xqY22-q4dLOhsuBb10uPHcnkEP8smSTtcwUqMpY';

const panel = document.getElementById('panel');
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');

function render(state, data = {}) {
  if (state === 'invalid') {
    panel.innerHTML = `
      <div class="icon pending">🔗</div>
      <h1>Invalid link</h1>
      <p>This unsubscribe link doesn't look right. If you'd like to unsubscribe, reply to any CarcinoS email and we'll take care of it.</p>
      <a href="https://carcino-s.com" class="btn btn-home">← Back to CarcinoS</a>`;

  } else if (state === 'confirm') {
    panel.innerHTML = `
      <div class="icon pending">📭</div>
      <h1>Unsubscribe from CarcinoS?</h1>
      <p>You'll stop receiving the weekly oncology digest. You can always sign up again at carcino-s.com.</p>
      <div>
        <button class="btn btn-confirm" onclick="doUnsubscribe()">Yes, unsubscribe me</button>
        <a href="https://carcino-s.com" class="btn btn-cancel">Cancel</a>
      </div>`;

  } else if (state === 'loading') {
    panel.innerHTML = `
      <div class="icon pending" style="background:transparent;">
        <div class="spinner"></div>
      </div>
      <h1>Unsubscribing…</h1>
      <p>One moment.</p>`;

  } else if (state === 'success') {
    panel.innerHTML = `
      <div class="icon success">✓</div>
      <h1>You've been unsubscribed</h1>
      <p>You won't receive any more CarcinoS digests. We're sorry to see you go.</p>
      <p class="sub">Changed your mind? Sign up again at carcino-s.com any time.</p>
      <a href="https://carcino-s.com" class="btn btn-home">← Back to CarcinoS</a>`;

  } else if (state === 'error') {
    panel.innerHTML = `
      <div class="icon error">!</div>
      <h1>Something went wrong</h1>
      <p>${data.message || 'We couldn\'t process your request. Please reply to any CarcinoS email and we\'ll unsubscribe you manually.'}</p>
      <a href="https://carcino-s.com" class="btn btn-home">← Back to CarcinoS</a>`;
  }
}

async function doUnsubscribe() {
  render('loading');
  try {
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/unsubscribe_user`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_user_id: uid }),
    });
    if (resp.ok) {
      render('success');
    } else {
      const err = await resp.text();
      render('error', { message: `Error ${resp.status}: ${err}` });
    }
  } catch (e) {
    render('error', { message: e.message });
  }
}

// Boot
if (!uid || uid.length < 30) {
  render('invalid');
} else {
  render('confirm');
}
</script>

</body>
</html>
